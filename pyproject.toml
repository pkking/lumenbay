[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lumenbay"
version = "0.1.0"
description = "Archive WeChat group photos into QQ group albums"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
lumenbay = "lumenbay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lumenbay"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: requires an explicitly authorized live test group and album",
]
