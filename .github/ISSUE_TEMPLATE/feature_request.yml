name: Feature request
description: Propose a scoped development task
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: User need
      description: Describe the problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Out of scope and risks
      description: Include account, privacy or compatibility constraints.
