name: Bug report
description: Report a reproducible issue without sharing private chat data
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior. Do not include passwords, tokens, private photos or chat logs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Prefer a synthetic or fake-adapter example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, adapter versions (if relevant)"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
